<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9f8f3">
<meta name="description" content="Practice with Kevin, a beat-bobbing stickman metronome with tap tempo, count-in, and adjustable clicks.">
<title>Kevin’s Metronome</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect x='1' y='1' width='58' height='58' rx='14' fill='%233c55e8'/%3E%3Cpath d='M29 11c-22 0-27 33-2 36 27 2 32-28 3-36M16 30q11 19 25-2' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3Cg fill='white'%3E%3Ccircle cx='22' cy='24' r='2.6'/%3E%3Ccircle cx='35' cy='22' r='2.6'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#22232b;--muted:#62636c;--paper:#f9f8f3;--blue:#4057e9;--blue-deep:#3046ce;--lilac:#e9ecff;--yellow:#ffdf6d;--line:#dcdcd7;--border:2px solid var(--ink);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(#a7a49a37 .7px,transparent .85px);background-size:6px 6px}
button,input,select{font:inherit;color:inherit}
button,select,input[type=range]{touch-action:manipulation;cursor:pointer}
button{border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4764f2;outline-offset:4px}
button,select{ -webkit-tap-highlight-color:transparent }
svg.icon{height:20px;width:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}
.wrap{width:min(1112px,calc(100% - 88px));margin-inline:auto}
header{background:#fffefb;border-bottom:var(--border)}
.topbar{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;gap:12px;align-items:center;font-size:1.28rem;font-weight:820;letter-spacing:-.065em}
.logo{width:38px;height:38px;border:var(--border);background:var(--blue);border-radius:10px;display:grid;place-items:center;transform:rotate(-5deg);box-shadow:2px 2px 0 var(--ink)}
.logo svg{width:31px;height:31px}
.brand em{font-style:normal;color:var(--blue-deep)}
.audio-btn,.mini-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border:1.5px solid var(--ink);background:#fff;border-radius:9px;box-shadow:1.5px 2px 0 var(--ink)}
.audio-btn{padding:8px 13px;font-size:.87rem}
.audio-btn svg.icon{width:17px;height:17px}
.audio-btn[aria-pressed=false]{color:#595a66;background:#f0efec}
main{padding:clamp(28px,4.1vh,48px) 0 0}
.heading-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px}
h1,h2,p{margin:0}
h1{position:relative;display:inline-block;font-weight:850;letter-spacing:-.07em;font-size:clamp(2.4rem,3.8vw,3.3rem);line-height:1.12}
.rays{position:absolute;right:-31px;top:-7px;width:30px;height:33px;transform:rotate(9deg)}
.status{font:650 .78rem/1.2 ui-monospace,"SFMono-Regular",Consolas,monospace;display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:30px;padding:7px 12px;background:#fffef9}
.status i{width:8px;height:8px;background:#f3c543;border:1.2px solid var(--ink);border-radius:50%}
.status[data-mode=playing] i{background:#75d399}.status[data-mode=count] i{background:#8596ff}
.layout{display:grid;grid-template-columns:minmax(0,1.97fr) minmax(295px,1fr);gap:23px;align-items:stretch}
.card{background:#fffefb;border:var(--border);border-radius:17px;box-shadow:4px 5px 0 var(--ink)}
.console{overflow:hidden;display:flex;flex-direction:column}
.stage{position:relative;display:flex;align-items:center;isolation:isolate;overflow:hidden;border-bottom:var(--border);flex:1;min-height:289px;padding:30px 34px;background-color:#e7eaff;background-image:linear-gradient(90deg,#7485d725 1px,transparent 1px),linear-gradient(#7485d725 1px,transparent 1px);background-size:21px 21px}
.tempo{position:relative;width:52%;z-index:2}
.eyebrow{display:flex;align-items:center;gap:7px;font:700 .76rem/1.3 ui-monospace,"SFMono-Regular",Consolas,monospace;letter-spacing:.115em;text-transform:uppercase}
.eyebrow .icon{width:17px;height:17px}
.number-row{display:flex;align-items:baseline;gap:9px;margin:4px 0 2px}
.bpm{font:780 clamp(5rem,7.5vw,7.1rem)/1 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:-.055em;padding:0 .08em 0 0;background:transparent;border:0;border-radius:4px;width:2em;min-width:0;color:var(--ink);appearance:textfield;font-variant-numeric:tabular-nums}
.bpm::-webkit-inner-spin-button,.bpm::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.unit{font:700 .94rem/1 ui-monospace,"SFMono-Regular",Consolas,monospace;color:#4e5372;letter-spacing:.06em}
.tempo-tag{width:fit-content;display:flex;align-items:center;gap:6px;background:var(--yellow);border:1.5px solid var(--ink);box-shadow:1px 2px 0 var(--ink);transform:rotate(-3deg);font-weight:740;font-size:.83rem;padding:2px 10px;border-radius:5px}
.tempo-tag .icon{width:14px;height:14px;stroke-width:2}
.tempo-adjust{display:flex;align-items:center;gap:12px;max-width:304px;margin-top:27px}
.mini-btn{height:33px;width:33px;flex:none;font-size:21px;border-radius:8px;padding:0}
.mini-btn .icon{width:16px;height:16px;stroke-width:2.4}
input[type=range]{--track-rest:#e7e6e1;--pct:50%;width:100%;min-width:0;height:32px;margin:0;background:transparent;appearance:none;-webkit-appearance:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border:1px solid var(--ink);border-radius:5px;background:linear-gradient(to right,var(--blue) var(--pct),var(--track-rest) var(--pct))}
input[type=range]::-moz-range-track{height:4px;border:1px solid var(--ink);border-radius:5px;background:linear-gradient(to right,var(--blue) var(--pct),var(--track-rest) var(--pct))}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;margin-top:-6px;height:16px;width:16px;border-radius:50%;background:var(--blue);border:1.5px solid var(--ink);box-shadow:0 1px 0 var(--ink)}
input[type=range]::-moz-range-thumb{height:14px;width:14px;border-radius:50%;background:var(--blue);border:1.5px solid var(--ink);box-shadow:0 1px 0 var(--ink)}
#tempoSlider{--track-rest:#fafaff}
.scene{position:absolute;z-index:0;right:1%;top:5%;bottom:5%;width:47%;pointer-events:none}
.scene svg{width:100%;height:100%;overflow:visible}
#kevin{transform-box:fill-box;transform-origin:center bottom;mix-blend-mode:multiply}
.console-controls{padding:25px 30px 28px}
.section-line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.section-line h2,.settings h2{font-size:1.18rem;letter-spacing:-.045em;line-height:1.25;font-weight:780}
#beatInfo{color:var(--muted);font:600 .76rem/1.3 ui-monospace,"SFMono-Regular",Consolas,monospace;text-align:right}
.beat-line{position:relative;display:flex;gap:4px;justify-content:space-between;align-items:center;margin:21px 7% 25px;isolation:isolate}
.beat-line::before{content:"";position:absolute;top:50%;height:0;border-top:2px dashed #c7c8d2;left:0;right:0;z-index:-1}
.beat{border-radius:50%;border:2px solid #a5a5b1;width:clamp(36px,4vw,48px);aspect-ratio:1;min-width:0;background:#f7f7f7;display:grid;place-items:center;color:#626271;font:650 .96rem/1 ui-monospace,"SFMono-Regular",Consolas,monospace}
.beat.accent{color:var(--blue-deep);background:#eceeff;border-color:var(--blue)}
.beat.filled{color:white;background:var(--blue);border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.beat.current{background:var(--yellow);border-color:var(--ink);color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.beat-line.many{margin-inline:0}.beat-line.many .beat{width:min(38px,8%);font-size:.78rem}
.transport{display:grid;grid-template-columns:1.65fr 1fr;gap:13px}
.action{position:relative;min-height:49px;display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;border:var(--border);border-radius:10px;font-weight:750;font-size:.98rem;letter-spacing:-.025em;box-shadow:2px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.action.start{background:var(--blue);color:#fff}
.action.start:hover{background:var(--blue-deep)}.action.tap:hover,.audio-btn:hover,.mini-btn:hover{background:#f0f1ff}
.action:active,.mini-btn:active,.audio-btn:active,.action.tapped{transform:translate(1px,2px);box-shadow:0 1px 0 var(--ink)}
.action .icon{height:18px;width:18px;stroke-width:2}
.settings{padding:24px 23px 22px;display:flex;flex-direction:column;justify-content:space-between}
.settings-title{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.settings-icon{width:31px;height:31px;border:1.5px solid var(--ink);border-radius:8px;display:grid;place-items:center;background:#e6eaff;color:var(--blue-deep);transform:rotate(-4deg)}
.settings-icon .icon{width:18px;height:18px}
.fields{display:grid;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
label,.switch-row{font-size:.9rem;font-weight:650;letter-spacing:-.018em}
.select-wrap{position:relative}
.select-wrap>.icon:first-child{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--blue-deep);width:17px;height:17px;pointer-events:none}
.select-wrap .chevron{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none}
select{width:100%;height:39px;appearance:none;background:#fafaf7;padding:0 32px 0 39px;border:1.5px solid #85868a;border-radius:7px;font-size:.9rem;font-weight:590;letter-spacing:-.015em}
select:hover{border-color:var(--ink);background:#f5f5fb}
.volume{margin-top:16px}.volume-top,.volume-slider,.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#volumeOut{font:600 .78rem ui-monospace,Consolas,monospace;color:var(--blue-deep)}
.volume-slider{gap:10px}.volume-slider .icon{width:15px;height:15px;color:var(--muted)}
.switches{border-top:1.5px dashed #c5c4c0;margin-top:9px;padding-top:10px}
.switch-row{width:100%;padding:6px 0;text-align:left;min-height:35px}
.switch-track{height:22px;width:38px;padding:2px;border:1.5px solid var(--ink);border-radius:20px;background:#d5d5d8;display:flex;align-items:center;flex:none}
.switch-track::after{content:"";display:block;width:14px;height:14px;background:white;border-radius:50%;border:1px solid var(--ink);transition:transform .15s}
[aria-checked=true] .switch-track{background:var(--blue)}[aria-checked=true] .switch-track::after{transform:translateX(16px)}
.shortcuts{display:flex;align-items:center;justify-content:center;gap:23px;margin:25px 0 18px;color:#60616b;font-size:.78rem}
.shortcuts>span{display:flex;align-items:center;gap:6px}.shortcuts .icon{width:17px;height:17px}
kbd{font:600 .72rem/1.25 ui-monospace,"SFMono-Regular",Consolas,monospace;color:#4b4b56;background:#fffefb;border:1px solid #b9b8b6;border-bottom-width:2px;border-radius:4px;padding:1px 5px}
#error{margin-top:16px;background:#fff1bc;border:var(--border);border-radius:8px;padding:10px 14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:1450px){main{padding-top:52px}.stage{min-height:320px}.settings{padding:28px}.console-controls{padding:30px 34px}}
@media(max-width:920px){.wrap{width:calc(100% - 48px)}.layout{gap:17px;grid-template-columns:minmax(0,1.58fr) minmax(258px,1fr)}.stage{padding:24px}.console-controls{padding:23px 20px}.settings{padding:22px 17px}.tempo-adjust{gap:8px}.bpm{font-size:5.1rem}.unit{font-size:.77rem}.number-row{gap:2px}.scene{right:-3%;width:48%}.tempo{width:56%}}
@media(max-width:720px){.wrap{width:min(100% - 32px,550px)}.topbar{min-height:62px}.brand{gap:8px;font-size:1.12rem}.logo{width:33px;height:33px}.logo svg{width:28px}.audio-btn{font-size:.8rem;min-height:36px;padding:6px 10px}main{padding-top:22px}.heading-row{margin-bottom:17px}.layout{grid-template-columns:1fr;gap:21px}.stage{min-height:219px;padding:21px}.scene{width:46%;right:0;top:4%;bottom:4%}.tempo{width:56%}.bpm{font-size:clamp(4.6rem,13vw,5.5rem)}.tempo-adjust{margin-top:16px}.mini-btn{height:34px;width:34px}.console-controls{padding:19px 18px 22px}.beat-line{margin-block:17px 19px}.action{min-height:46px}.settings{padding:21px}.settings-title{margin-bottom:18px}.fields{grid-template-columns:1fr 1fr;gap:12px}.field:last-child{grid-column:1/-1}.volume{margin-top:16px}.switches{display:grid;grid-template-columns:1fr 1fr;gap:16px}.shortcuts{gap:12px;flex-wrap:wrap}.section-line h2{font-size:1.1rem}.status{font-size:.71rem;padding:6px 9px}.rays{width:23px;right:-23px}select{height:44px}.switch-row{min-height:43px}}
@media(max-width:390px){.wrap{width:calc(100% - 26px)}.stage{padding:17px}.unit{font-size:.73rem}.scene{right:-3%;width:46%}.settings{padding:18px}.switches{display:block}.action{font-size:.9rem}.transport{gap:8px}.section-line{gap:5px}#beatInfo{font-size:.69rem}.beat-line.many{gap:2px}.beat-line.many .beat{font-size:.66rem}.eyebrow{font-size:.7rem}}
@media(max-width:480px){
 .scene svg{position:relative;width:134%;height:118%;left:-17%;top:-9%}
 .transport{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}
 .action{gap:6px;padding:0 4px;font-size:.9rem;white-space:nowrap}
 .fields{grid-template-columns:minmax(0,1fr)}
 .field{display:grid;grid-template-columns:minmax(90px,.7fr) minmax(0,1.2fr);align-items:center;gap:8px}
 .field select{font-size:1rem}
 .mini-btn{position:relative}.mini-btn::before{content:"";position:absolute;inset:-5px}
}
@media(hover:none) and (pointer:coarse){.shortcuts{display:none}main{padding-bottom:24px}}
@media(prefers-reduced-motion:reduce){*,*::after{transition:none!important;scroll-behavior:auto!important}}
.top-actions{display:flex;align-items:center;gap:10px}
.beat.minor{transform:scale(.65)}
@media(min-width:921px){body{min-height:100dvh;display:flex;flex-direction:column}.wrap{width:calc(100% - clamp(42px,5vw,96px))}main.wrap{flex:1;display:flex;flex-direction:column}.layout{flex:1;grid-template-columns:minmax(0,2.2fr) minmax(285px,1fr)}.stage{padding:clamp(32px,4vw,76px)}.tempo-adjust{max-width:420px}.bpm{font-size:clamp(6rem,9vw,10rem)}.settings{justify-content:center;gap:clamp(4px,1.4vh,16px)}.scene{max-height:65vh;align-self:center}.console-controls{padding:clamp(22px,2.2vw,40px)}}
@media(max-width:720px){.top-actions{gap:8px}#theme{font-size:1.25rem;width:38px;height:38px;padding:0}#theme span:last-child{display:none}.brand{font-size:clamp(.93rem,4.15vw,1.12rem)}}
@media(pointer:coarse) and (max-height:550px) and (orientation:landscape){.topbar{min-height:48px}main{padding-top:12px}.heading-row{margin-bottom:12px}h1{font-size:1.7rem}.layout{grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr)}.wrap{width:calc(100% - 28px)}.stage{min-height:180px}.shortcuts{display:none}}
:root[data-theme=dark]{color-scheme:dark;--ink:#ececf5;--paper:#191a21;--muted:#c0c1cd;--blue:#5368f2;--blue-deep:#acb6ff;--border:2px solid #565967}
[data-theme=dark] :is(header,.card,.audio-btn,.mini-btn,.action.tap,kbd,select){background:#252631;color:var(--ink)}
[data-theme=dark] .stage{background-color:#30364c}
[data-theme=dark] .scene svg{filter:drop-shadow(0 0 1px #c6cde0)}
[data-theme=dark] .tempo-tag,[data-theme=dark] .beat.current{color:#20212a}
[data-theme=dark] .unit,[data-theme=dark] .shortcuts{color:#c8cbe2}
[data-theme=dark] .beat:not(.filled):not(.current){background:#31333e;color:#e0e1f0}
[data-theme=dark] .settings-icon{background:#374264}
[data-theme=dark] :is(.card,.action,.audio-btn,.mini-btn,.logo){box-shadow:3px 4px 0 #08090d}
[data-theme=dark] #error{background:#473e24}
[data-theme=dark] .action.start:hover{background:#4154cb}
/* Desktop practice controls share the available viewport height. */
@media (hover:hover) and (pointer:fine) {
 body{zoom:var(--desk-scale,1);min-height:calc(100dvh / var(--desk-scale,1));display:flex;flex-direction:column}
 .wrap{width:calc(100% - clamp(28px,4vw,72px));max-width:none}
 .topbar{min-height:clamp(46px,7vh,68px)}
 main.wrap{display:flex;flex-direction:column;flex:1;padding-top:clamp(8px,2vh,24px)}
 .heading-row{margin-bottom:clamp(8px,1.7vh,18px)}h1{font-size:clamp(1.65rem,4.6vh,3rem)}
 .layout{flex:1;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:clamp(14px,2vw,26px)}
 .stage{min-height:0;padding:clamp(12px,2.8vh,36px)}
 .bpm{font-size:clamp(4.2rem,12vh,8rem)}
 .tempo-adjust{margin-top:clamp(8px,2vh,22px)}
 .console-controls,.settings{padding:clamp(12px,2vh,26px)}
 .beat-line{margin-block:clamp(8px,1.7vh,18px)}
 .settings{justify-content:space-evenly;gap:4px}
 .settings-title,.volume,.switches{margin-block:4px}
 .fields{grid-template-columns:1fr;gap:clamp(4px,1vh,12px)}
 .field{display:flex;gap:3px}.field select{height:clamp(32px,4.7vh,42px)}
 .switches{display:block;padding-top:5px}
 .shortcuts{margin:clamp(8px,1.6vh,18px) 0}
}
@media (hover:hover) and (pointer:fine) and (max-height:660px){
 .field{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:center}
 .settings{justify-content:center;gap:8px}
 .action{min-height:40px}.beat{width:34px}
}
/* Let the settings panel end just below its last switch. */
.settings.card{align-self:start;justify-content:flex-start;gap:12px}
.settings.card .settings-title,.settings.card .volume,.settings.card .switches{margin-block:0}
@media(max-height:660px) and (hover:hover) and (pointer:fine){.settings.card{gap:8px}}
/* Sequencer */
[hidden]{display:none!important}
.view-toggle{display:flex;gap:3px;padding:3px;background:#fff;border:var(--border);border-radius:11px;box-shadow:2px 3px 0 var(--ink)}
.view-toggle button{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:7px;font-weight:750;font-size:.88rem;letter-spacing:-.02em}
.view-toggle button .icon{width:16px;height:16px}
.view-toggle button:hover{background:#f0f1ff}
.view-toggle button[aria-pressed=true],.view-toggle button[aria-pressed=true]:hover{background:var(--blue);color:#fff}
.seq{margin-top:23px;padding:24px}
.seq-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:16px}
.seq-head .settings-title{margin:0}
.seq-sum{font:600 .76rem/1.3 ui-monospace,"SFMono-Regular",Consolas,monospace;color:var(--muted)}
.seq-track{display:flex;gap:4px;padding-bottom:14px;margin-bottom:18px;border-bottom:var(--border)}
.tseg{position:relative;overflow:hidden;min-width:0;height:34px;display:grid;place-items:center;background:#e9ecff;border:1.5px solid var(--ink);border-radius:7px;font:700 .7rem/1 ui-monospace,"SFMono-Regular",Consolas,monospace;transition:box-shadow .12s,transform .12s}
.tseg.wait{background:#d8ad43;color:#20212a}
.tseg.wait i{background:#20212a;opacity:.2}
.tseg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue);opacity:.3}
.tseg span{position:relative;white-space:nowrap}
.tseg.active{transform:translateY(-2px);box-shadow:0 3px 0 var(--ink)}
.seq-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sblk{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px 12px 6px;background:#eef0ff;border:var(--border);border-radius:13px;box-shadow:2px 3px 0 var(--ink);overflow:hidden;transition:box-shadow .12s,transform .12s,background .12s}
.sblk.wait{background:#fff4bf;border-style:dashed}
.sblk.active{background:#dce1ff;transform:translate(1px,2px);box-shadow:0 1px 0 var(--ink)}
.sblk.wait.active{background:#ffeb94}
.sblk.drag{z-index:3;transition:none;background:#fff;box-shadow:6px 9px 0 var(--ink)}
.grip{align-self:stretch;width:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted);cursor:grab;touch-action:none}
.grip:hover{background:#0000000d;color:var(--ink)}
.sblk.drag .grip{cursor:grabbing}
.sbody{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px}
.shead,.sctrl{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px}
.skind{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border:1.5px solid var(--ink);box-shadow:1px 2px 0 var(--ink);transform:rotate(-2deg);font-weight:740;font-size:.83rem;padding:2px 10px;border-radius:5px}
.sblk.wait .skind{background:var(--yellow);color:var(--ink)}
.skind .icon{width:14px;height:14px;stroke-width:2}
.smeterwrap{width:98px}
.smeter{height:36px;padding:0 28px 0 12px;font:700 .9rem ui-monospace,"SFMono-Regular",Consolas,monospace}
.stepper{display:flex;align-items:center;gap:7px}
.scount,.sbpmin{height:36px;text-align:center;background:#fafaf7;border:1.5px solid #85868a;border-radius:7px;font:650 .95rem/1 ui-monospace,"SFMono-Regular",Consolas,monospace;appearance:textfield;-moz-appearance:textfield}
.scount{width:62px}.sbpmin{width:68px}
.scount::-webkit-inner-spin-button,.scount::-webkit-outer-spin-button,.sbpmin::-webkit-inner-spin-button,.sbpmin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.slabel,.sbpm,.sbars{font-size:.84rem;font-weight:650;color:var(--muted)}
.sbpm{display:inline-flex;align-items:center;gap:7px}
.sbars{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
.sacts{display:flex;gap:8px;flex:none}
.sprog{position:absolute;left:0;bottom:0;height:5px;width:var(--prog,0%);background:var(--ink);transition:width .1s linear}
.seq-empty{padding:22px;text-align:center;border:2px dashed #b3b4bc;border-radius:12px;color:var(--muted);font-weight:600}
.seq-add{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}
body[data-view=seq] .stage{min-height:clamp(240px,34vh,300px)}
@media(min-width:721px) and (pointer:fine){
body[data-view=seq] .scene{top:12%;bottom:12%;right:3%;width:40%;max-height:none;translate:0 -8px}
}
@media(max-width:720px){
.heading-row{flex-wrap:wrap}
.view-toggle button{padding:6px 11px}
.seq{padding:18px 16px 20px}
.seq-head{margin-bottom:14px}
.seq-track{padding-bottom:12px;margin-bottom:16px}
.tseg{height:30px}
.seq-list{gap:14px}
.sblk{display:grid;grid-template-columns:34px minmax(0,1fr) auto;grid-template-areas:"grip head acts" "grip ctrl ctrl";gap:12px 8px;align-items:center;padding:12px 12px 17px 6px}
.grip{grid-area:grip;width:34px;background:#0000000a}
.sbody{display:contents}
.shead{grid-area:head;min-width:0}
.sctrl{grid-area:ctrl;min-width:0;gap:12px 16px}
.sacts{grid-area:acts}
.stepper{gap:8px;flex-wrap:wrap}
.stepper .mini-btn{width:40px;height:40px}
.scount,.sbpmin,.smeter{height:40px;font-size:1rem}
.scount{width:64px}.sbpmin{width:74px}.smeterwrap{width:104px}
.seq-add{gap:10px}
body[data-view=seq] main{display:flex;flex-direction:column;gap:21px}
body[data-view=seq] .heading-row{margin-bottom:0}
body[data-view=seq] .layout{display:contents}
body[data-view=seq] .console{order:1}
body[data-view=seq] .seq{order:2;margin-top:0}
body[data-view=seq] .settings{order:3;align-self:stretch}
body[data-view=seq] #error{order:4}
body[data-view=seq] .shortcuts{order:5;margin:0}
body[data-view=seq] .stage{min-height:219px}
}
[data-theme=dark] :is(.view-toggle,.sblk,.tseg){background:#252631}
[data-theme=dark] :is(.view-toggle,.sblk){box-shadow:3px 4px 0 #08090d}
[data-theme=dark] .view-toggle button:hover{background:#31344a}
[data-theme=dark] .view-toggle button[aria-pressed=true]{background:var(--blue)}
[data-theme=dark] .sblk.wait{background:#3a3626}
[data-theme=dark] .tseg.wait{background:#d8ad43;color:#20212a}
[data-theme=dark] .sblk.active{background:#323a63}
[data-theme=dark] .sblk.wait.active{background:#51471f}
[data-theme=dark] .sblk.drag{background:#2e3040;box-shadow:6px 9px 0 #08090d}
[data-theme=dark] :is(.scount,.sbpmin){background:#31333e;border-color:#6a6d80}
[data-theme=dark] .sprog{background:var(--blue-deep)}
[data-theme=dark] .sblk.wait .skind{color:#20212a}
[data-theme=dark] .seq-empty{border-color:#565967}
</style>
</head>

<script>
// All sounds are synthesized locally. No requests or samples are required.
'use strict';
// Keep short or narrow mouse-driven windows in the two-column desktop layout.
const desktopPointer = matchMedia('(hover:hover) and (pointer:fine)');
function fitDesktop() {
  const scale = desktopPointer.matches ? Math.min(1, innerHeight/535, innerWidth/830) : 1;
  document.body.style.setProperty('--desk-scale', String(scale));
}
fitDesktop();
window.addEventListener('resize', fitDesktop);
desktopPointer.addEventListener?.('change', fitDesktop);

const $ = (id) => document.getElementById(id);
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const defaults = { bpm:120, meter:'4/4', division:1, voice:'wood', volume:75, countIn:true, accent:true, muted:false };
const storeKey = 'kevins-metronome.settings.v1';
const prefs = { ...defaults };
try {
  const saved = JSON.parse(localStorage.getItem(storeKey)) || {};
  for (const [key, low, high] of [['bpm',30,300], ['division',1,4], ['volume',0,200]]) {
    if (Number.isInteger(saved[key])) prefs[key] = clamp(saved[key], low, high);
  }
  for (const key of ['meter','voice']) {
    if (Array.from($(key).options).some(option => option.value === saved[key])) prefs[key] = saved[key];
  }
  for (const key of ['countIn','accent','muted']) {
    if (typeof saved[key] === 'boolean') prefs[key] = saved[key];
  }
} catch {}
function save() {
  try { localStorage.setItem(storeKey, JSON.stringify(prefs)); } catch {}
}
function setIcon(element, name) {
  element.querySelector('use').setAttribute('href', '#i-' + name);
}
function updateRange(element) {
  element.style.setProperty('--pct', (element.value-element.min)/(element.max-element.min)*100 + '%');
}
function updateTempo(value) {
  prefs.bpm = clamp(Math.round(value), 30, 300);
  $('bpm').value = prefs.bpm;
  $('bpm').style.width = String(prefs.bpm).length + 'ch';
  $('tempoSlider').value = prefs.bpm;
  $('tempoSlider').setAttribute('aria-valuetext', prefs.bpm + ' beats per minute');
  updateRange($('tempoSlider'));
  const names = [[40,'Grave'],[60,'Largo'],[66,'Larghetto'],[76,'Adagio'],[108,'Andante'],[120,'Moderato'],[156,'Allegro'],[176,'Vivace'],[200,'Presto'],[301,'Prestissimo']];
  $('tempoName').textContent = names.find(([limit]) => prefs.bpm < limit)[1];
  refreshSeqTempo();
}
function beatsPerBar() { return Number(prefs.meter.split('/')[0]); }
function syncDivisionLabels() {
  const unit = Number(prefs.meter.split('/')[1]);
  const notes = {2:'Half notes',4:'Quarter notes',8:'Eighth notes',16:'Sixteenth notes',32:'32nd notes'};
  const names = [notes[unit], notes[unit*2], 'Triplets', notes[unit*4]];
  Array.from($('division').options).forEach((option, i) => option.textContent = names[i]);
  $('pulseHelp').textContent = 'Tempo counts ' + notes[unit].toLowerCase() + ' in ' + prefs.meter + '.';
}
function syncSound() {
  $('volume').value = prefs.volume;
  $('volumeOut').textContent = prefs.volume + '%';
  updateRange($('volume'));
  $('mute').setAttribute('aria-pressed', String(!prefs.muted));
  $('mute').querySelector('span').textContent = prefs.muted ? 'Sound off' : 'Sound on';
  setIcon($('mute'), prefs.muted ? 'mute' : 'volume');
  if (master) master.gain.setTargetAtTime(prefs.muted ? 0 : prefs.volume/100, context.currentTime, .006);
}
function syncSwitches() {
  for (const id of ['accent','countIn']) $(id).setAttribute('aria-checked', String(prefs[id]));
}
let phase = 'idle';
let screenMode = '', characterMotion;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const mainBeats = {'3/8':[0], '5/8':[0,3], '6/8':[0,3], '7/8':[0,2,4], '9/8':[0,3,6], '12/8':[0,3,6,9]};
function circles(total, accent, meter) {
  const row = $('beats');
  if (row.children.length !== total) {
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < total; i++) {
      const el = document.createElement('span');
      el.textContent = i + 1;
      fragment.appendChild(el);
    }
    row.replaceChildren(fragment);
  }
  row.classList.toggle('many', total > 6);
  for (let i = 0; i < total; i++) row.children[i].className = 'beat' + (i === 0 && accent ? ' accent' : '') + (mainBeats[meter] && !mainBeats[meter].includes(i) ? ' minor' : '');
}
function setMode(mode) {
  if (screenMode === mode) return;
  screenMode = mode;
  const active = mode !== 'idle';
  setIcon($('start'), active ? 'stop' : 'play');
  $('start').querySelector('span').textContent = view === 'seq' ? (active ? 'Stop sequence' : 'Play sequence') : (active ? 'Stop metronome' : 'Start metronome');
}
function showIdle() {
  setMode('idle');
  markSeq(-1);
  if (view === 'seq') {
    const first = seqList[0];
    circles(first ? seqSpan(first) : beatsPerBar(), !!first && first.type === 'play' && prefs.accent, first && first.type === 'play' ? first.meter : null);
    $('beatInfo').textContent = seqList.length ? seqList.length + (seqList.length === 1 ? ' block' : ' blocks') + ' ready' : 'Add a block to begin';
    return;
  }
  circles(prefs.countIn ? 4 : beatsPerBar(), !prefs.countIn && prefs.accent, prefs.countIn ? null : prefs.meter);
  $('beatInfo').textContent = prefs.countIn ? '4-beat count-in' : beatsPerBar() + ' beats per bar';
}
function showBeat(event) {
  setMode(event.count ? 'count' : 'playing');
  circles(event.total, !event.count && prefs.accent, event.count ? null : event.meter);
  const dots = $('beats').children;
  if (event.count) {
    for (let i = 0; i <= event.beat; i++) dots[i].classList.add('filled');
  } else dots[event.beat].classList.add('current');
  $('beatInfo').textContent = event.info || ((event.count ? 'Count-in ' : 'Beat ') + (event.beat + 1) + ' of ' + event.total);
  if (event.seq !== undefined) markSeq(event.seq, event.prog);
  if (!reduceMotion.matches && typeof $('kevin').animate === 'function') {
    characterMotion?.cancel();
    const angle = event.beat % 2 ? 5 : -5;
    characterMotion = $('kevin').animate([
      {transform:'translateY(0) rotate(0)'}, {transform:'translateY(-4px) rotate(' + angle + 'deg)', offset:.35}, {transform:'translateY(0) rotate(0)'}
    ], {duration:Math.min(310, event.duration*830), easing:'ease-out'});
  }
}
// The audio clock sets the time for each click. Animation frames only paint indicators.
let context, master, transportBus, mediaRoute, silenceURL, idleTimer;
const sampleCache = new Map();
let timer, frame, generation = 0, visualQueue = [];
let barMeter;
// Sequencer state: an ordered list of sections (meter + counts) and waits (clicks only).
const seqKey = 'kevins-metronome.sequence.v1';
const meterList = Array.from($('meter').options).map(option => option.value);
let view = 'practice', seqOn = false, seqDone = false, seqIdx = 0, seqCount = 0, seqBlock = null, seqLoop = false;
let seqList = [{id:1,type:'wait',meter:'4/4',counts:4,bpm:0}, {id:2,type:'play',meter:'4/4',counts:16,bpm:0}, {id:3,type:'play',meter:'12/8',counts:12,bpm:0}];
let seqSeed = 4;
try {
  const saved = JSON.parse(localStorage.getItem(seqKey));
  if (saved && Array.isArray(saved.list)) {

  $('tabSeq').setAttribute('aria-pressed', String(seq));
  $('seqCard').hidden = !seq;
  $('viewTitle').textContent = seq ? 'Sequencer' : 'Practice room';
  $('meter').closest('.field').hidden = seq;
  $('countIn').hidden = seq;
  screenMode = '';
  showIdle(); feedback();
}
$('tabPractice').onclick = () => setView('practice');
$('tabSeq').onclick = () => setView('seq');
window.addEventListener('pagehide', () => { stop(); mediaRoute?.pause(); });
$('meter').value = prefs.meter; $('division').value = prefs.division; $('voice').value = prefs.voice;
renderSeq();
syncDivisionLabels(); updateTempo(prefs.bpm); syncSound(); syncSwitches(); showIdle();

</script>
</body></html>
